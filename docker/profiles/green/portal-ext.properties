##
## GREEN profile: production defaults restored, plus compression.
## No developer overrides: CSS fast load, minification, template caches and the
## Header/ETag filters are back to Liferay's production defaults.
##

#
# Liferay's GZip filter is OFF by default (compression is expected at the proxy/CDN).
# With no proxy in this Docker setup, turn it on in Liferay itself.
#
com.liferay.portal.servlet.filters.gzip.GZipFilter=true

#
# Database
#
jdbc.default.driverClassName=org.postgresql.Driver
jdbc.default.url=jdbc:postgresql://postgres:5432/lportal
jdbc.default.username=liferay
jdbc.default.password=liferay

#
# Workshop features (2026.Q3): llms.txt (beta) and MCP Server
#
feature.flag.LPD-80518=true
feature.flag.LPD-63311=true

setup.wizard.enabled=false
terms.of.use.required=false
users.reminder.queries.enabled=false

#
# Local CDN (guide 2.1b). Prefer the UI: Instance Settings > Instance Configuration > General.
# Fallback if the fields aren't there: uncomment and restart with the green command.
#
#cdn.host.http=http://127.0.0.1:8081
#cdn.host.https=
#cdn.dynamic.resources.enabled=true

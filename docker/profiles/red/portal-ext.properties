##
## RED profile: the "it worked on my machine" configuration that reached production.
## Every override below is a real-world anti-pattern the workshop fixes.
##

#
# Anti-pattern 1: developer mode shipped to production.
# portal-developer.properties turns off CSS and image fast load (unbundled CSS),
# the minifier, template caches and the Header/ETag filters (no browser caching),
# and switches the JS caching strategy to one hash per file.
#
include-and-override=portal-developer.properties

#
# Anti-pattern 2: no response compression anywhere. Liferay's GZip filter is off by
# default and there is no proxy/CDN in front of this server to compress for it.
#
com.liferay.portal.servlet.filters.gzip.GZipFilter=false

#
# Database
#
jdbc.default.driverClassName=org.postgresql.Driver
jdbc.default.url=jdbc:postgresql://postgres:5432/lportal
jdbc.default.username=liferay
jdbc.default.password=liferay

#
# Workshop features (2026.Q3): llms.txt (beta) and MCP Server
#
feature.flag.LPD-80518=true
feature.flag.LPD-63311=true

setup.wizard.enabled=false
terms.of.use.required=false
users.reminder.queries.enabled=false

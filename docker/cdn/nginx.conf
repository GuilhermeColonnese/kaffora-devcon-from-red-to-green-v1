# Kaffora "local CDN": an Nginx edge with origin pull in front of Liferay.
# What it simulates: compression of static assets, an edge cache (X-Cache: MISS/HIT) and CORS for
# a separate CDN host. What it can't simulate on localhost: geographic proximity.
#
# Two ways to use it (both on port 8081):
#   A) CDN Host:   Instance Settings -> Instance Configuration -> General -> CDN Host HTTP = http://127.0.0.1:8081
#                  The page stays on :8080, static resources are rewritten to the CDN host.
#   B) Full edge:  test http://kaffora.localhost:8081/ (whole site through the edge, like a
#                  full-site CDN). No Liferay setting needed.

proxy_cache_path /var/cache/nginx/kaffora levels=1:2 keys_zone=kaffora:50m max_size=2g inactive=7d use_temp_path=off;

upstream liferay_origin {
    server liferay:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- compression at the edge (what GZipFilter doesn't do for static bundle resources)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml
               image/svg+xml text/plain font/ttf application/x-font-ttf application/vnd.ms-fontobject;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # ask the origin for the uncompressed body: the edge stores one copy and compresses it itself
    proxy_set_header Accept-Encoding "";

    add_header X-Served-By "kaffora-edge" always;

    location = /__cdn {
        default_type text/plain;
        return 200 "kaffora-edge ok\n";
    }

    # --- APIs, MCP and auth: never cached
    location ^~ /o/mcp            { proxy_pass http://liferay_origin; }
    location ^~ /o/headless-      { proxy_pass http://liferay_origin; }
    location ^~ /o/c/             { proxy_pass http://liferay_origin; }
    location ^~ /o/oauth2         { proxy_pass http://liferay_origin; }
    location ^~ /o/api            { proxy_pass http://liferay_origin; }

    # --- static resources: cached at the edge, origin pull on MISS
    # (demo only: /documents/ is cached without permission checks; in production keep
    #  permission-checked files off the CDN)
    location ~* ^/(o|combo|documents|image)/|\.(css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|webp|avif|gif|ico)$ {
        proxy_pass http://liferay_origin;

        proxy_cache kaffora;
        proxy_cache_key $scheme$http_host$request_uri;
        proxy_cache_valid 200 301 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        # the edge decides what to cache; the browser still gets Liferay's own Cache-Control
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;

        # a separate CDN host needs CORS (ES modules, fonts)
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache $upstream_cache_status always;
        add_header X-Served-By "kaffora-edge" always;
    }

    # --- pages: compressed at the edge, never cached (sessions, personalization)
    location / {
        proxy_pass http://liferay_origin;
        add_header X-Cache "BYPASS" always;
        add_header X-Served-By "kaffora-edge" always;
    }
}
